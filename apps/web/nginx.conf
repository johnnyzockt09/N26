# Reverse proxy: serves the SPA and forwards /api to the backend container.
# Public clients only ever reach this nginx. The API/DB are not exposed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for smaller payloads over playit.gg
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (the API also sets them via helmet for /api)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # API reverse proxy -> backend container on the compose network
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed assets (index-*.js / index-*.css)
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
